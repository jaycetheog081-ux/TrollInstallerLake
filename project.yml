name: TrollInstallerLake

options:
  bundleIdPrefix: com.trollinstallerlake
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_BITCODE: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  TrollInstallerX:
    type: application
    platform: iOS

    sources:
      - path: TrollInstallerX
        excludes:
          - "Preview Content/**"

    resources:
      - path: TrollInstallerX/Resources/TrollStore.tar
        optional: true

    dependencies:
      - sdk: IOKit.framework
      - sdk: libarchive.tbd
      - sdk: libz.tbd

    settings:
      base:
        PRODUCT_NAME: TrollInstallerLake
        PRODUCT_BUNDLE_IDENTIFIER: com.trollinstallerlake.app
        INFOPLIST_KEY_CFBundleDisplayName: TrollInstallerLake
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Required for supported installer functionality."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: TrollInstallerX/TrollInstallerX-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/TrollInstallerX/External/include"
          - "$(PROJECT_DIR)/TrollInstallerX/Exploitation"
        SYSTEM_HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/TrollInstallerX/External/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/TrollInstallerX/External/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lchoma"
          - "-lxpf"
          - "-lpartial"
          - "-lgrabkernel2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_OPTIMIZATION_LEVEL: "0"

        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          VALIDATE_PRODUCT: YES

schemes:
  TrollInstallerLake:
    build:
      targets:
        TrollInstallerX: all
    run:
      config: Debug
    archive:
      config: Release
