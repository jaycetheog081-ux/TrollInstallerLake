name: Build TrollInstallerLake

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew update
          brew install xcodegen ldid

      - name: Clone Titan
        run: |
          git clone --recurse-submodules https://github.com/alfiecg24/Titan /tmp/Titan

      - name: Build Titan
        run: |
          cd /tmp/Titan
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "=== Full tree ===" && find . -not -path "./.git/*" -type f
          SRCS=$(find . -not -path "./.git/*" \( -name "*.c" -o -name "*.m" \))
          echo "=== Sources ===" && echo "$SRCS"
          INCS=$(find . -not -path "./.git/*" -name "*.h" -exec dirname {} \; | sort -u)
          IFLAGS=""
          for inc in $INCS; do IFLAGS="$IFLAGS -I$inc"; done
          echo "=== Include flags ===" && echo "$IFLAGS"
          COMPILED=0
          for src in $SRCS; do
            out="${src%.*}.arm64.o"
            xcrun clang \
              -target arm64-apple-ios15.0 \
              -isysroot "$SDK" \
              $IFLAGS \
              -O2 -c "$src" -o "$out" \
              && echo "OK: $src" && COMPILED=$((COMPILED+1)) \
              || echo "FAIL: $src"
          done
          echo "=== Compiled $COMPILED files ==="
          if [ "$COMPILED" -eq 0 ]; then
            echo "ERROR: nothing compiled"
            exit 1
          fi
          OBJS=$(find . -not -path "./.git/*" -name "*.arm64.o")
          xcrun ar rcs libTitan.a $OBJS
          cp libTitan.a $GITHUB_WORKSPACE/TrollInstallerX/External/lib/
          mkdir -p $GITHUB_WORKSPACE/TrollInstallerX/External/include/Titan
          find . -not -path "./.git/*" -name "*.h" | xargs -I{} cp {} \
            $GITHUB_WORKSPACE/TrollInstallerX/External/include/Titan/
          echo "=== Titan build complete ==="

      - name: Clone Momentarius
        run: |
          git clone --recurse-submodules https://github.com/staturnzz/momentarius /tmp/momentarius

      - name: Build Momentarius
        run: |
          cd /tmp/momentarius
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "=== Full tree ===" && find . -not -path "./.git/*" -type f
          SRCS=$(find . -not -path "./.git/*" \( -name "*.c" -o -name "*.m" \))
          echo "=== Sources ===" && echo "$SRCS"
          INCS=$(find . -not -path "./.git/*" -name "*.h" -exec dirname {} \; | sort -u)
          IFLAGS=""
          for inc in $INCS; do IFLAGS="$IFLAGS -I$inc"; done
          echo "=== Include flags ===" && echo "$IFLAGS"
          COMPILED=0
          for src in $SRCS; do
            out="${src%.*}.arm64.o"
            xcrun clang \
              -target arm64-apple-ios15.0 \
              -isysroot "$SDK" \
              $IFLAGS \
              -O2 -c "$src" -o "$out" \
              && echo "OK: $src" && COMPILED=$((COMPILED+1)) \
              || echo "FAIL: $src"
          done
          echo "=== Compiled $COMPILED files ==="
          if [ "$COMPILED" -eq 0 ]; then
            echo "ERROR: nothing compiled"
            exit 1
          fi
          OBJS=$(find . -not -path "./.git/*" -name "*.arm64.o")
          xcrun ar rcs libmomentarius.a $OBJS
          cp libmomentarius.a $GITHUB_WORKSPACE/TrollInstallerX/External/lib/
          mkdir -p $GITHUB_WORKSPACE/TrollInstallerX/External/include/Momentarius
          find . -not -path "./.git/*" -name "*.h" | xargs -I{} cp {} \
            $GITHUB_WORKSPACE/TrollInstallerX/External/include/Momentarius/
          echo "=== Momentarius build complete ==="

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Build application
        run: |
          xcodebuild \
            -project TrollInstallerLake.xcodeproj \
            -scheme TrollInstallerLake \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e

          APP_PATH="DerivedData/Build/Products/Release-iphoneos/TrollInstallerLake.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Application bundle not found."
            exit 1
          fi

          if [ ! -f "Resources/ents.plist" ]; then
            echo "ERROR: Resources/ents.plist not found."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$APP_PATH/Info.plist")

          if [ -z "$EXECUTABLE" ] || [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: Application executable not found."
            exit 1
          fi

          ldid -SResources/ents.plist "$APP_PATH/$EXECUTABLE"

          zip -qry TrollInstallerLake.ipa Payload

          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollInstallerLake-IPA
          path: TrollInstallerLake.ipa
          if-no-files-found: error
          retention-days: 14
